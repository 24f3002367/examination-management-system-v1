{% extends "base.html" %}
{% block content %}
<div class="mt-4">
    <h2>Manage Courses</h2>
    <hr>
    <div class="card p-4 mb-4">
        <h4>Add New Course</h4>
        <form method="POST">
            <div class="mb-3"><label>Course Code</label><input type="text" name="course_code" class="form-control" required></div>
            <div class="mb-3"><label>Course Name</label><input type="text" name="course_name" class="form-control" required></div>
            <div class="mb-3"><label>Description</label><textarea name="description" class="form-control"></textarea></div>
            <button type="submit" class="btn btn-primary">Add Course</button>
        </form>
    </div>
    <h4>Existing Courses</h4>
    <div class="table-responsive">
        <table class="table">
            <thead><tr><th>Code</th><th>Name</th><th>Description</th><th>Action</th></tr></thead>
            <tbody>
                {% for c in courses %}
                <tr><td>{{ c.course_code }}</td><td>{{ c.course_name }}</td><td>{{ c.description }}</td>
                <td><a href="{{ url_for('delete_course', id=c.id) }}" class="btn btn-danger btn-sm">Delete</a></td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary mt-3">Back to Dashboard</a>
</div>
{% endblock %}
